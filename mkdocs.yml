site_name: Fullstack Academy AI/ML cohort 2605
site_url: https://gperdrizet.github.io/fullstack-2605/
repo_url: https://github.com/gperdrizet/fullstack-2605
repo_name: gperdrizet/fullstack-2605

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/download.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - attr_list
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.arithmatex:
      generic: true

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
  palette:
    primary: custom
    accent: custom

nav:
  - Home: index.md
  - Notebooks: notebooks.md
  - GitHub repos: github-repos.md
  - Datasets: datasets.md
  - Resources:
    - Linux commands: resources/linux-commands.md
    - Notebook shortcuts: resources/notebook-shortcuts.md
    - Documentation links: resources/documentation-links.md
    - Time management: resources/time-management-planning.md
    - Plotting: resources/plotting-overview.md
    - Statistics: resources/statistics-overview.md
    - Data wrangling: resources/data-wrangling.md
    - Feature engineering: resources/feature-engineering.md
    - Regression: resources/regression.md
    - Classification: resources/classification.md
    - Ensemble methods: resources/ensemble-learning.md
    - Dev tools install guide: resources/dev-tools-install-guide.md
    - Dev container setup guide: resources/dev-container-guide.md
  - Changelog: changelog.md
